monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - mail # Mail sent/failed events (MailerEventsSubscriber): never mailed, to avoid an error-mail loop

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: [ "!event" ]
            console:
                type: console
                process_psr_3_messages: false
                channels: [ "!event", "!doctrine", "!console" ]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [ 404, 405 ]
                channels: [ "!event" ]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: grouped
                excluded_http_codes: [ 404, 405 ]
                channels: [ "!deprecation", "!mail" ]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            grouped:
                type: group
                members: [ nested, mail_safe ]
            # A failing error mail (SMTP refused, OVH forbids mail from SSH...) must not
            # crash the request or the cron: the error is already written by "nested".
            mail_safe:
                type: whatfailuregroup
                members: [ deduplicated ]
            # Mail the buffered log to the webmaster when an error occurs (same error mailed once per 60 s)
            deduplicated:
                type: deduplication
                handler: mailer
            mailer:
                type: symfony_mailer
                from_email: '%env(MERCREDI_FROM)%'
                to_email: 'webmaster@marche.be'
                subject: 'Hotton Error Occurred! %%message%%'
                level: debug
                formatter: monolog.formatter.html
                content_type: text/html
            # Shared hosting (OVH): stderr ends up in the Apache logs, so write to var/log
            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                max_files: 30
                level: debug
            # Mail sent/failed events, always written to the file and never mailed
            mail:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                max_files: 30
                level: info
                channels: [ mail ]
            console:
                type: console
                process_psr_3_messages: false
                channels: [ "!event", "!doctrine" ]
            deprecation:
                type: stream
                channels: [ deprecation ]
                path: php://stderr
                formatter: monolog.formatter.json
