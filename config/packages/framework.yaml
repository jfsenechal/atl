# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        # 12 h d'inactivité avant expiration. Fichiers dans var/ : le dossier de session
        # partagé de l'hébergeur serait purgé par d'autres sites avec leur propre durée.
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        gc_maxlifetime: 43200
        # Le nettoyage des vieux fichiers se fait au fil des requêtes (1 fois sur 100)
        gc_probability: 1
        gc_divisor: 100

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
